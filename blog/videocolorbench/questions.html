<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>VideoColorBench questions</title>
<meta name=description content="Every VideoColorBench question with what each model answered.">
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A5%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{font-family:Georgia,'Times New Roman',Times,serif;font-variant-numeric:lining-nums;margin:0;color:#1a1a1a;line-height:1.5;background:#fff}
  .wrap{max-width:1100px;margin:2rem auto;padding:0 1rem}
  h1{border-bottom:3px solid #2c3e50;padding-bottom:.3rem}
  .note{color:#666;font-size:.86rem;margin:.2rem 0 .6rem}
  a{color:inherit}
  .back-home{display:inline-flex;align-items:center;gap:.35rem;margin:0 0 .4rem;font-size:.85rem;color:#888;text-decoration:none;letter-spacing:.01em}
  .back-home:hover{color:#111}
  .back-home .arw{transition:transform .15s ease}
  .back-home:hover .arw{transform:translateX(-2px)}
  .bar{padding:.6rem 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #eee}
  .bar button{font:inherit;font-size:.82rem;padding:.3rem .7rem;border:1px solid #ccc;border-radius:99px;background:#fff;cursor:pointer;color:#444}
  .bar button.on{background:#2c3e50;border-color:#2c3e50;color:#fff}
  .bar .score{margin-left:auto;font-size:.8rem;color:#666;display:flex;gap:.9rem;flex-wrap:wrap}
  .bar .score>span{display:inline-flex;align-items:center;gap:.3rem}
  .q{margin:1.6rem 0;padding-bottom:1.2rem;border-bottom:1px solid #eee}
  .q img{width:100%;height:90px;border-radius:8px;display:block}
  .q h3{margin:0 0 .5rem;font-size:1rem}
  .q img{margin-bottom:.5rem}
  .q h3 small{color:#888;font-weight:400}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  @media(max-width:620px){.opts{grid-template-columns:1fr}}
  .opt{font-size:.85rem;padding:.35rem .55rem;border:1px solid #e1e4e8;border-radius:7px;display:flex;gap:.45rem;align-items:center;min-height:3.6rem}
  .opt .name{flex:0 1 auto;min-width:0}
  .opt .tags{flex:1 1 0;min-width:6rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
  .opt .tags:empty{display:none}
  @media(max-width:620px){.opt{flex-wrap:wrap}.opt .name{flex:1 1 0}.opt .tags{flex:1 1 100%;padding-left:1.1rem}}
  .opt b{color:#888;font-weight:600}
  .opt.right{background:#e3f4e8;border-color:#3a9a5c}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:99px;color:#fff;vertical-align:middle;font-size:.68rem;font-weight:700;line-height:13px;white-space:nowrap}
  .tag svg{width:13px;height:13px;fill:currentColor;display:block}
  .tag.openai{background:#1a1a1a}.tag.claude{background:#d97757}.tag.qwen{background:#615ced}.tag.zai{background:#2e9d57}
</style>

<div class=wrap>
<h1>Every question</h1>
<a class=back-home href="./"><span class=arw>←</span> back to the post</a>
<div class=bar id=bar></div>
<div id=list></div>
</div>

<script>
const MCB = {init(d) { this.data = d; }, detail() {}};
</script>
<script src="data.js"></script>

const svg = d => `<svg viewBox="0 0 24 24" aria-hidden=true><path fill-rule=evenodd d="${d}"/></svg>`;
const tag = k => `<span class="tag ${tags[k].logo}" title="${esc(runs[k])}" aria-label="${esc(runs[k])}">${svg(LOGO[tags[k].logo])}${esc(tags[k].text)}</span>`;
let only = 'all';
function draw() {
  const qs = questions.filter(q => only === 'all' || q.ds === only).sort((a, b) => (a.ds === 'films') - (b.ds === 'films'));  // YouTube first
  const key = Object.keys(runs).map(k => `<span>${tag(k)} ${esc(runs[k])}</span>`).join('');
  document.getElementById('bar').innerHTML = [['all', 'All'], ['youtube', 'YouTube'], ['films', 'Films']].map(([k, t]) =>
    `<button data-k="${k}" class="${k === only ? 'on' : ''}">${t}</button>`).join('') + `<span class=score>${key}</span>`;
  document.getElementById('list').innerHTML = qs.map((q, n) => `<div class=q>
    <h3>${n + 1}. ${esc(q.title)} <small>${q.ds === 'films' ? 'film' : 'YouTube'}</small></h3>
    <img loading=lazy src="barcodes/${q.ds}/${q.id}.png" alt="barcode">
    <div class=opts>${q.choices.map((c, j) => `<div class="opt ${letter(j) === q.answer ? 'right' : ''}"><b>${letter(j)}</b><span class=name>${esc(c)}</span><span class=tags>${
      Object.keys(runs).filter(k => q.runs[k].g === letter(j)).map(tag).join('')}</span></div>`).join('')}</div>
  </div>`).join('');
}
document.getElementById('bar').addEventListener('click', e => { if (e.target.dataset.k) { only = e.target.dataset.k; draw(); scrollTo(0, 0); } });
draw();
