<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLM model-family figure</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto}

/* HTML recreation of the model-family hero graphic. Brand marks are embedded from
   source assets, not redrawn: Qwen, InternLM, Google, and Noto's volcano emoji. */
.vlm-hero-figure{
    --ink:#3268f4;
    --soft:#cfdbff;
    position:relative;
    width:100%;
    max-width:1100px;
    aspect-ratio:1648 / 928;
    margin:1.6rem auto 2.4rem;
    overflow:hidden;
    isolation:isolate;
    border-radius:18px;
    background:
      radial-gradient(circle at 50% 49%,rgba(205,220,255,.34) 0 17%,rgba(235,241,255,.18) 42%,transparent 67%),
      linear-gradient(115deg,#fff 0%,#fbfcff 49%,#fff 100%);
}
.vlm-hero-figure::before{
    content:"";
    position:absolute;
    inset:6% 13%;
    z-index:-2;
    background:radial-gradient(ellipse at center,rgba(171,194,255,.18),transparent 66%);
    filter:blur(18px);
}
.vlm-hero-figure .vlm-orbit{
    position:absolute;
    inset:7.2% 19.7% 10.2%;
    width:60.6%;
    height:82.6%;
    overflow:visible;
}
.vlm-hero-figure .vlm-orbit ellipse{
    fill:none;
    stroke:#cfdaff;
    stroke-width:10;
    stroke-linecap:round;
    stroke-dasharray:1 20.2;
    opacity:.88;
}
.vlm-hero-figure .vlm-logo-node{
    position:absolute;
    width:14.55%;
    aspect-ratio:1;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(255,255,255,.97);
    box-shadow:0 14px 42px rgba(93,118,188,.10),0 0 0 1px rgba(218,226,245,.20);
    z-index:3;
}
.vlm-hero-figure .vlm-logo-node img{
    display:block;
    width:62%;
    height:62%;
    object-fit:contain;
}
.vlm-hero-figure .vlm-qwen{left:21.25%;top:10.45%}
.vlm-hero-figure .vlm-intern{right:21.25%;top:10.45%}
.vlm-hero-figure .vlm-google{left:21.25%;bottom:14.1%}
.vlm-hero-figure .vlm-volcano{right:21.25%;bottom:14.1%}
.vlm-hero-figure .vlm-qwen img{width:61%;height:61%}
.vlm-hero-figure .vlm-intern img{width:64%;height:64%}
.vlm-hero-figure .vlm-google img{width:57%;height:57%}
.vlm-hero-figure .vlm-volcano img{width:62%;height:62%}
.vlm-hero-figure .vlm-core{
    position:absolute;
    left:36.4%;
    top:21.1%;
    width:28.8%;
    height:auto;
    overflow:visible;
    filter:drop-shadow(0 16px 18px rgba(65,104,210,.09));
    z-index:2;
}
.vlm-hero-figure .vlm-spark{
    position:absolute;
    width:3.1%;
    aspect-ratio:1;
    opacity:.78;
}
.vlm-hero-figure .vlm-spark-left{left:20.1%;top:43.2%}
.vlm-hero-figure .vlm-spark-right{right:19.4%;top:44.7%}
.vlm-hero-figure .vlm-spark path{fill:#bed0ff}
.vlm-hero-figure figcaption{
    position:absolute!important;
    width:1px!important;
    height:1px!important;
    padding:0!important;
    margin:-1px!important;
    overflow:hidden!important;
    clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;
    border:0!important;
}
@media (max-width:700px){
    .vlm-hero-figure{border-radius:12px;margin:1.1rem auto 1.8rem}
    .vlm-hero-figure .vlm-logo-node{box-shadow:0 7px 22px rgba(93,118,188,.10)}
}
