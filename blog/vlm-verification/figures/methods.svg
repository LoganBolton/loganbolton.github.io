<svg viewBox="0 0 1180 580" xmlns="http://www.w3.org/2000/svg" font-family="EB Garamond, Garamond, Georgia, serif">
  <defs>
    <marker id="arr" viewBox="0 0 9 9" refX="7.5" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 9 9" refX="7.5" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2f6b3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 9 9" refX="7.5" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#a63d33"/>
    </marker>

    <g id="thumb">
      <rect x="0" y="0" width="92" height="62" rx="3" fill="#ffffff" stroke="#b8b0a3" stroke-width="1"/>
      <line x1="30" y1="8" x2="30" y2="52" stroke="#efece6" stroke-width="1"/>
      <line x1="48" y1="8" x2="48" y2="52" stroke="#efece6" stroke-width="1"/>
      <line x1="66" y1="8" x2="66" y2="52" stroke="#efece6" stroke-width="1"/>
      <line x1="12" y1="22" x2="84" y2="22" stroke="#efece6" stroke-width="1"/>
      <line x1="12" y1="36" x2="84" y2="36" stroke="#efece6" stroke-width="1"/>
      <path d="M12 8 V52 H84" fill="none" stroke="#6b655c" stroke-width="1.1"/>
      <polyline points="14,50 30,46 46,44 62,40 78,36" fill="none" stroke="#a97b2e" stroke-width="1.3" stroke-dasharray="3 2.5"/>
      <polyline points="14,46 26,41 38,42 50,31 63,24 76,14" fill="none" stroke="#4d6b8a" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50" cy="31" r="1.6" fill="#4d6b8a"/>
      <circle cx="63" cy="24" r="1.6" fill="#4d6b8a"/>
      <circle cx="76" cy="14" r="1.6" fill="#4d6b8a"/>
    </g>

    <g id="gavel">
      <g transform="rotate(-45)">
        <rect x="-6.5" y="-9.5" width="13" height="7.5" rx="1.5" fill="#7a5c8a"/>
        <rect x="-1.4" y="-2" width="2.8" height="12" rx="1.4" fill="#7a5c8a"/>
      </g>
    </g>

    <g id="lens">
      <circle cx="7" cy="7" r="5.4" fill="#ffffff" stroke="#000000" stroke-width="1.9"/>
      <line x1="11.2" y1="11.2" x2="15.8" y2="15.8" stroke="#000000" stroke-width="2.1" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    text{dominant-baseline:middle;}
    .title{font-size:19px;font-weight:600;fill:#2b2b2b;letter-spacing:1px;}
    .node{font-size:15px;font-weight:600;letter-spacing:.3px;fill:#38342d;}
    .snode{fill:#2f4a66;}
    .jnode{fill:#553d68;}
    .imglab{font-size:12px;font-style:italic;fill:#6b655c;}
    .cap{font-size:14px;font-style:italic;fill:#5a544b;}
    .tiny{font-size:11px;font-style:italic;fill:#8a6423;}
    .flow{stroke:#3a3a3a;stroke-width:1.3;fill:none;stroke-linecap:round;}
    .fan{stroke:#3a3a3a;stroke-width:1.1;fill:none;stroke-linecap:round;}
    .solver{fill:#dbe6f1;stroke:#4d6b8a;stroke-width:1.3;}
    .judge{fill:#e6dcef;stroke:#7a5c8a;stroke-width:1.3;}
    .answer{fill:#efece5;stroke:#9a9184;stroke-width:1.1;}
    .caprule{stroke:#DCDCDC;stroke-width:1;}
  </style>

  <rect x="0" y="0" width="1180" height="580" fill="#ffffff"/>

  <!-- uniform panels -->
  <rect x="14"  y="16" width="276" height="548" rx="8" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1.1"/>
  <rect x="304" y="16" width="276" height="548" rx="8" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1.1"/>
  <rect x="594" y="16" width="276" height="548" rx="8" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1.1"/>
  <rect x="884" y="16" width="282" height="548" rx="8" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1.1"/>

  <!-- uniform title bands -->
  <rect x="14"  y="16" width="276" height="42" rx="8" fill="#F0F0F0"/>
  <rect x="14"  y="50" width="276" height="8" fill="#F0F0F0"/>
  <rect x="304" y="16" width="276" height="42" rx="8" fill="#F0F0F0"/>
  <rect x="304" y="50" width="276" height="8" fill="#F0F0F0"/>
  <rect x="594" y="16" width="276" height="42" rx="8" fill="#F0F0F0"/>
  <rect x="594" y="50" width="276" height="8" fill="#F0F0F0"/>
  <rect x="884" y="16" width="282" height="42" rx="8" fill="#F0F0F0"/>
  <rect x="884" y="50" width="282" height="8" fill="#F0F0F0"/>

  <text class="title" x="152" y="39" text-anchor="middle">Baseline</text>
  <text class="title" x="442" y="39" text-anchor="middle">Majority Vote</text>
  <text class="title" x="732" y="39" text-anchor="middle">Zoom Tool</text>
  <text class="title" x="1025" y="39" text-anchor="middle">VLM Judge</text>

  <!-- ============ Baseline ============ -->
  <g>
    <use href="#thumb" x="106" y="82"/>
    <text class="imglab" x="152" y="162" text-anchor="middle">image</text>

    <line class="flow" x1="152" y1="170" x2="152" y2="192" marker-end="url(#arr)"/>

    <rect class="solver" x="88" y="196" width="128" height="42" rx="4"/>
    <text class="node snode" x="152" y="218" text-anchor="middle">Solver VLM</text>

    <line class="flow" x1="152" y1="238" x2="152" y2="440" marker-end="url(#arr)"/>

    <rect class="answer" x="98" y="446" width="108" height="38" rx="4"/>
    <text class="node" x="152" y="466" text-anchor="middle">answer</text>

    <line class="caprule" x1="72" y1="512" x2="232" y2="512"/>
    <text class="cap" x="152" y="534" text-anchor="middle">one forward pass</text>
  </g>

  <!-- ============ Majority vote ============ -->
  <g>
    <use href="#thumb" x="396" y="82"/>
    <text class="imglab" x="442" y="162" text-anchor="middle">image</text>

    <line class="flow" x1="442" y1="170" x2="442" y2="192" marker-end="url(#arr)"/>

    <rect class="solver" x="378" y="196" width="128" height="42" rx="4"/>
    <text class="node snode" x="442" y="218" text-anchor="middle">Solver VLM</text>

    <line class="fan" x1="442" y1="240" x2="350" y2="282" marker-end="url(#arr)"/>
    <line class="fan" x1="442" y1="240" x2="396" y2="282" marker-end="url(#arr)"/>
    <line class="fan" x1="442" y1="240" x2="442" y2="282" marker-end="url(#arr)"/>
    <line class="fan" x1="442" y1="240" x2="488" y2="282" marker-end="url(#arr)"/>
    <line class="fan" x1="442" y1="240" x2="534" y2="282" marker-end="url(#arr)"/>

    <rect x="331" y="286" width="38" height="26" rx="3" fill="#ffffff" stroke="#b0a892" stroke-width="1"/>
    <rect x="377" y="286" width="38" height="26" rx="3" fill="#ffffff" stroke="#b0a892" stroke-width="1"/>
    <rect x="423" y="286" width="38" height="26" rx="3" fill="#ffffff" stroke="#b0a892" stroke-width="1"/>
    <rect x="469" y="286" width="38" height="26" rx="3" fill="#ffffff" stroke="#b0a892" stroke-width="1"/>
    <rect x="515" y="286" width="38" height="26" rx="3" fill="#ffffff" stroke="#b0a892" stroke-width="1"/>
    <text x="350" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#3f3a33">a&#8321;</text>
    <text x="396" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#3f3a33">a&#8322;</text>
    <text x="442" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#3f3a33">a&#8323;</text>
    <text x="488" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#3f3a33">a&#8324;</text>
    <text x="534" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#3f3a33">a&#8325;</text>

    <line class="fan" x1="350" y1="314" x2="404" y2="336" marker-end="url(#arr)"/>
    <line class="fan" x1="396" y1="314" x2="423" y2="336" marker-end="url(#arr)"/>
    <line class="fan" x1="442" y1="314" x2="442" y2="336" marker-end="url(#arr)"/>
    <line class="fan" x1="488" y1="314" x2="461" y2="336" marker-end="url(#arr)"/>
    <line class="fan" x1="534" y1="314" x2="480" y2="336" marker-end="url(#arr)"/>

    <rect x="365" y="340" width="154" height="34" rx="4" fill="#ffffff" stroke="#5a544b" stroke-width="1.4"/>
    <text class="node" x="442" y="358" text-anchor="middle">majority vote</text>

    <line class="flow" x1="442" y1="374" x2="442" y2="440" marker-end="url(#arr)"/>

    <rect class="answer" x="388" y="446" width="108" height="38" rx="4"/>
    <text class="node" x="442" y="466" text-anchor="middle">answer</text>

    <line class="caprule" x1="362" y1="512" x2="522" y2="512"/>
    <text class="cap" x="442" y="534" text-anchor="middle">the most common answer wins</text>
  </g>

  <!-- ============ Zoom tool ============ -->
  <g>
    <use href="#thumb" x="686" y="82"/>
    <rect x="740" y="94" width="28" height="26" fill="#3f7a7a" opacity="0.08"/>
    <rect x="740" y="94" width="28" height="26" fill="none" stroke="#3f7a7a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text class="imglab" x="732" y="162" text-anchor="middle">image</text>

    <line class="flow" x1="732" y1="170" x2="732" y2="192" marker-end="url(#arr)"/>

    <rect class="solver" x="668" y="196" width="128" height="42" rx="4"/>
    <text class="node snode" x="732" y="218" text-anchor="middle">Solver VLM</text>

    <line class="flow" x1="702" y1="242" x2="702" y2="272" marker-end="url(#arr)"/>
    <line class="flow" x1="762" y1="274" x2="762" y2="244" marker-end="url(#arr)"/>
    <text class="tiny" x="692" y="260" text-anchor="end">crop</text>
    <text class="tiny" x="772" y="260">zoomed image</text>

    <rect x="673" y="278" width="118" height="76" rx="4" fill="#ffffff" stroke="#3f7a7a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <g transform="translate(673,278)">
      <line x1="59" y1="8" x2="59" y2="68" stroke="#efece6" stroke-width="1"/>
      <line x1="10" y1="38" x2="108" y2="38" stroke="#efece6" stroke-width="1"/>
      <polyline points="18,62 48,44 100,14" fill="none" stroke="#4d6b8a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="48" cy="44" r="3.6" fill="#4d6b8a"/>
      <circle cx="100" cy="14" r="3.6" fill="#4d6b8a"/>
    </g>
    <circle cx="681" cy="281" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.1"/>
    <use href="#lens" x="673" y="273"/>

    <line class="flow" x1="732" y1="358" x2="732" y2="440" marker-end="url(#arr)"/>

    <rect class="answer" x="678" y="446" width="108" height="38" rx="4"/>
    <text class="node" x="732" y="466" text-anchor="middle">answer</text>

    <line class="caprule" x1="642" y1="512" x2="822" y2="512"/>
    <text class="cap" x="732" y="534" text-anchor="middle">the solver inspects a magnified crop</text>
  </g>

  <!-- ============ VLM judge ============ -->
  <g>
    <use href="#thumb" x="979" y="82"/>
    <text class="imglab" x="1025" y="162" text-anchor="middle">image</text>

    <line class="flow" x1="1025" y1="170" x2="1025" y2="190" marker-end="url(#arr)"/>

    <rect class="solver" x="961" y="194" width="128" height="42" rx="4"/>
    <text class="node snode" x="1025" y="216" text-anchor="middle">Solver VLM</text>

    <line class="flow" x1="1025" y1="236" x2="1025" y2="256" marker-end="url(#arr)"/>

    <rect class="answer" x="975" y="260" width="100" height="34" rx="4"/>
    <text class="node" x="1025" y="277" text-anchor="middle" font-size="14">answer</text>

    <line class="flow" x1="1025" y1="294" x2="1025" y2="316" marker-end="url(#arr)"/>

    <rect class="judge" x="961" y="320" width="128" height="42" rx="4"/>
    <use href="#gavel" transform="translate(988,341)"/>
    <text class="node jnode" x="1040" y="341" text-anchor="middle">Judge VLM</text>

    <line x1="1025" y1="362" x2="1025" y2="440" stroke="#2f6b3a" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrG)"/>
    <text x="1035" y="403" font-size="12" font-style="italic" fill="#2f6b3a">&#10003; accept</text>

    <path d="M961 342 C 915 342, 915 215, 955 215" fill="none" stroke="#a63d33" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
    <text transform="translate(908,278) rotate(-90)" text-anchor="middle" font-size="11.5" font-style="italic" fill="#a63d33">&#10007; reject, retry</text>

    <rect class="answer" x="961" y="446" width="128" height="38" rx="4"/>
    <text class="node" x="1025" y="466" text-anchor="middle">final answer</text>

    <line class="caprule" x1="945" y1="512" x2="1105" y2="512"/>
    <text class="cap" x="1025" y="534" text-anchor="middle">rejected answers are regenerated</text>
  </g>
</svg>